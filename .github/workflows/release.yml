name: Release

# Cuts a GitHub Release when a version tag is pushed (e.g. v0.1.0).
# Release-only: no npm publish. Verifies the code runs under Bun, then
# packages the source as a tarball asset and publishes release notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can build a changelog

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify modules load (parse + import check)
        run: |
          # Bun runs TS directly; importing every entry surfaces syntax/import
          # errors without needing a separate TypeScript install.
          bun build bin/kiro-recall.ts src/daemon.ts src/mcp/server.ts \
            --target=bun --outdir=/tmp/kiro-recall-build
          echo "modules parsed + bundled OK"

      - name: Smoke test (CLI)
        run: |
          bun run bin/kiro-recall.ts version
          bun run bin/kiro-recall.ts help

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun -e "console.log(require('./package.json').version)")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version ok: $PKG"

      - name: Build changelog
        id: changelog
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## kiro-recall ${GITHUB_REF_NAME}"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since ${PREV}:"
              echo
              git log --pretty="- %s (%h)" "${PREV}..${GITHUB_REF_NAME}"
            else
              echo "Initial release."
              echo
              git log --pretty="- %s (%h)" "${GITHUB_REF_NAME}" | head -50
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Package source tarball
        run: |
          NAME="kiro-recall-${GITHUB_REF_NAME}"
          tar --exclude=node_modules --exclude=.git \
              -czf "${NAME}.tar.gz" \
              bin src package.json bun.lock tsconfig.json install.sh README.md LICENSE NOTICE
          ls -lh "${NAME}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: kiro-recall ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: kiro-recall-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
